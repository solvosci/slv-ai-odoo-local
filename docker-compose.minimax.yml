name: slv-ai-api-minimax

services:
  api:
    build: ./api
    image: solvy/api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8010}:8000"
    environment:
      ODOO_URL: http://odoo:8069
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:?Falta MINIMAX_API_KEY en el .env}
      MINIMAX_BASE_URL: ${MINIMAX_BASE_URL:-https://api.minimax.io/v1}
      MINIMAX_MODEL: ${MINIMAX_MODEL:-MiniMax-M3}
      MINIMAX_TEMPERATURE: ${MINIMAX_TEMPERATURE:-0.3}
      MINIMAX_MAX_TOKENS: ${MINIMAX_MAX_TOKENS:-2048}
      MINIMAX_TIMEOUT: ${MINIMAX_TIMEOUT:-60}
      TRANSCRIBER: ${TRANSCRIBER:-minimax}
      TRANSCRIBE_LANGUAGE: ${TRANSCRIBE_LANGUAGE:-es}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-solvy-api}

