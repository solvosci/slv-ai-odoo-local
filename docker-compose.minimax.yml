name: slv-ai

services:
  db:
    image: postgres:${POSTGRES_VERSION:-16}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  odoo:
    build:
      context: .
      args:
        ODOO_VERSION: ${ODOO_VERSION:-17.0}
    image: slv-ai/odoo:${ODOO_VERSION:-17.0}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ODOO_PORT:-8069}:8069"
      - "${ODOO_LONGPOLLING_PORT:-8072}:8072"
    environment:
      HOST: db
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    volumes:
      - odoo-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons

  api:
    build: ./api
    image: slv-ai/api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8010}:8000"
    environment:
      ODOO_URL: http://odoo:8069
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:?Falta MINIMAX_API_KEY en el .env}
      MINIMAX_BASE_URL: ${MINIMAX_BASE_URL:-https://api.minimax.io/v1}
      MINIMAX_MODEL: ${MINIMAX_MODEL:-MiniMax-M3}
      MINIMAX_TEMPERATURE: ${MINIMAX_TEMPERATURE:-0.3}
      MINIMAX_MAX_TOKENS: ${MINIMAX_MAX_TOKENS:-4096}
      MINIMAX_TIMEOUT: ${MINIMAX_TIMEOUT:-60}
      TRANSCRIBER: ${TRANSCRIBER:-minimax}
      TRANSCRIBE_LANGUAGE: ${TRANSCRIBE_LANGUAGE:-es}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-slv-ai-api}

volumes:
  db-data:
  odoo-data:
